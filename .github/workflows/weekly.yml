name: Weekly meal plan

on:
  schedule:
    - cron: '17 5 * * 0'   # Sunday 06:17 Copenhagen (07:17 in summer) – new avis starts Sunday
    - cron: '17 9 * * 1'   # Monday retry, in case Sunday's offers weren't online yet
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # redeploy when you change the page or recipes; put [rebuild] in the commit message to also refetch offers

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch offers and pick meals
        id: plan
        if: github.event_name != 'push' || hashFiles('data/week.json') == '' || contains(github.event.head_commit.message, '[rebuild]')
        continue-on-error: true
        run: node scripts/build-week.mjs --save-offers data/offers-raw.json

      - name: Save the new plan to the repo
        if: steps.plan.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/week.json data/offers-raw.json data/prices.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Meal plan for week $(node -p "require('./data/week.json').week")"
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/week.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Flag a failed offer fetch
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::Couldn't fetch this week's REMA 1000 offers. The site still shows the previous plan. See the 'Fetch offers' step log."
          exit 1
